name: '[Maintenance] Sync fork with upstream'
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force_patches:
        description: 'Apply fork patches even if already up-to-date with upstream'
        required: false
        type: boolean
        default: false
      force_pr:
        description: 'Always create a PR instead of pushing directly to main'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/bitnami/charts.git
          git fetch upstream

      - name: Check if fork is behind upstream
        id: check
        run: |
          behind="$(git rev-list --count main..upstream/main)"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Fork is $behind commit(s) behind upstream"

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout main
          if ! git merge --no-edit upstream/main; then
            echo "::error::Merge conflict — manual resolution required"
            git merge --abort
            exit 1
          fi

      - name: Apply fork patches
        if: steps.check.outputs.behind != '0' || inputs.force_patches
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          OCI_REPO="oci://$(echo "$REGISTRY")/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/bitnamicharts"

          # --- Patch 1: Neuter image restriction checks in the common library chart ---
          # Replace insecureImages error (blocks helm install when images are changed)
          # Uses awk to track define/end nesting depth so inner {{- end -}} lines are handled correctly
          awk '
            /^\{\{- define "common.errors.insecureImages"/ {
              skip=1; depth=1
              print "{{- define \"common.errors.insecureImages\" -}}"
              next
            }
            skip {
              # Count opening blocks (if/range/with/block/define) but NOT else/else if
              n = gsub(/\{\{-? *(if|range|with|block|define) /, "&")
              depth += n
              # Count closing ends
              n = gsub(/\{\{-? *end *-?\}\}/, "&")
              depth -= n
              if (depth <= 0) {
                print "{{- end -}}"
                skip = 0
              }
              next
            }
            { print }
          ' bitnami/common/templates/_errors.tpl > /tmp/_errors.tpl && \
            mv /tmp/_errors.tpl bitnami/common/templates/_errors.tpl

          # Replace modifiedImages warning
          awk '
            /^\{\{- define "common.warnings.modifiedImages"/ {
              skip=1; depth=1
              print "{{- define \"common.warnings.modifiedImages\" -}}"
              next
            }
            skip {
              n = gsub(/\{\{-? *(if|range|with|block|define) /, "&")
              depth += n
              n = gsub(/\{\{-? *end *-?\}\}/, "&")
              depth -= n
              if (depth <= 0) {
                print "{{- end -}}"
                skip = 0
              }
              next
            }
            { print }
          ' bitnami/common/templates/_warnings.tpl > /tmp/_warnings.tpl && \
            mv /tmp/_warnings.tpl bitnami/common/templates/_warnings.tpl

          # --- Patch 2: Rewrite chart dependency repositories to fork's GHCR ---
          find bitnami -name Chart.yaml -exec \
            sed -i "s|oci://registry-1.docker.io/bitnamicharts|${OCI_REPO}|g" {} +

          # --- Patch 3: Remove Chart.lock files (digests are invalidated by repo change) ---
          # The publish workflow uses 'helm dependency update' to regenerate them at build time.
          find bitnami -name Chart.lock -delete

          echo "Patches applied: image checks neutered, deps rewritten to ${OCI_REPO}, Chart.lock files removed"

      - name: Commit patches
        if: steps.check.outputs.behind != '0' || inputs.force_patches
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "chore: apply fork patches (rewrite deps, remove image checks)"
          fi

      - name: Push or create PR
        if: steps.check.outputs.behind != '0' || inputs.force_patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ inputs.force_pr }}" != "true" ]] && git push origin main 2>/dev/null; then
            echo "Pushed directly to main"
          else
            echo "Creating PR instead of pushing directly"
            branch="upstream-sync/$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$branch"
            git push origin "$branch"

            # Close any stale sync PRs and delete their branches
            gh pr list --repo "${{ github.repository }}" --head "upstream-sync/" --state open --json number,headRefName \
              --jq '.[] | "\(.number) \(.headRefName)"' | while read -r pr_number pr_branch; do
              gh pr close "$pr_number" --repo "${{ github.repository }}" --comment "Superseded by newer sync PR" --delete-branch || true
            done

            gh pr create \
              --repo "${{ github.repository }}" \
              --title "chore: sync with upstream bitnami/charts" \
              --body "Automated upstream sync. Direct push failed due to workflow file permission restrictions. Merge this PR to complete the sync." \
              --base main \
              --head "$branch"
          fi

      - name: Clean up
        run: git remote remove upstream
