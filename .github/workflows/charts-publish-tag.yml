name: "[CI/CD] Publish chart from tag"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag or pattern (e.g. common/2.27.0 or redis/22.x to backfill a major version)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  discover:
    name: Resolve tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Checkout (for tag listing)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag pattern
        id: resolve
        shell: bash
        run: |
          input="${{ inputs.tag }}"
          chart="${input%%/*}"
          version_pattern="${input#*/}"

          if [[ -z "$chart" || -z "$version_pattern" || "$chart" == "$version_pattern" ]]; then
            echo "::error::Invalid format '$input'. Expected <chart>/<version> or <chart>/<major>.x"
            exit 1
          fi

          # Only allow wildcards at minor/patch level (e.g. 22.x, 22.1.x), not bare x
          if [[ "$version_pattern" == "x" || "$version_pattern" == "*" ]]; then
            echo "::error::Too broad — specify at least a major version, e.g. ${chart}/22.x"
            exit 1
          fi

          # Convert user-friendly 'x' wildcard to git glob '*'
          glob_pattern="${chart}/${version_pattern//x/*}"
          echo "Searching for tags matching: $glob_pattern"

          mapfile -t matching_tags < <(git tag -l "$glob_pattern" | sort -V)

          if [[ ${#matching_tags[@]} -eq 0 ]]; then
            echo "::error::No tags found matching '$glob_pattern'"
            exit 1
          fi

          echo "Found ${#matching_tags[@]} matching tag(s):"
          printf '  %s\n' "${matching_tags[@]}"

          # Safety cap: limit to 150 tags per run
          if [[ ${#matching_tags[@]} -gt 150 ]]; then
            echo "::error::Pattern matches ${#matching_tags[@]} tags (max 150). Use a more specific pattern."
            exit 1
          fi

          tags_json="$(printf '%s\n' "${matching_tags[@]}" | jq -R -s -c 'split("\n") | map(select(length>0))')"
          echo "tags=$tags_json" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.tag }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tag: ${{ fromJson(needs.discover.outputs.tags) }}
    steps:
      - name: Parse tag
        id: parse
        shell: bash
        run: |
          tag="${{ matrix.tag }}"
          chart="${tag%%/*}"
          version="${tag#*/}"
          echo "chart=$chart" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "context=bitnami/$chart" >> "$GITHUB_OUTPUT"
          echo "Publishing chart=$chart version=$version"

      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.tag }}

      - name: Verify chart exists at tag
        shell: bash
        run: |
          chart_yaml="${{ steps.parse.outputs.context }}/Chart.yaml"
          if [[ ! -f "$chart_yaml" ]]; then
            echo "::error::$chart_yaml not found at tag ${{ matrix.tag }}"
            exit 1
          fi
          actual_version="$(awk -F': ' '$1=="version"{print $2; exit}' "$chart_yaml")"
          expected="${{ steps.parse.outputs.version }}"
          if [[ "$actual_version" != "$expected" ]]; then
            echo "::error::Chart.yaml version ($actual_version) does not match tag version ($expected)"
            exit 1
          fi

      - name: Apply fork patches
        shell: bash
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          OCI_REPO="oci://$(echo "$REGISTRY")/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/bitnamicharts"

          # --- Patch 1: Neuter image restriction checks in the common library chart ---
          if [[ -f bitnami/common/templates/_errors.tpl ]]; then
            awk '
              /^\{\{- define "common.errors.insecureImages"/ {
                skip=1; depth=1
                print "{{- define \"common.errors.insecureImages\" -}}"
                next
              }
              skip {
                n = gsub(/\{\{-? *(if|range|with|block|define) /, "&")
                depth += n
                n = gsub(/\{\{-? *end *-?\}\}/, "&")
                depth -= n
                if (depth <= 0) {
                  print "{{- end -}}"
                  skip = 0
                }
                next
              }
              { print }
            ' bitnami/common/templates/_errors.tpl > /tmp/_errors.tpl && \
              mv /tmp/_errors.tpl bitnami/common/templates/_errors.tpl
          fi

          if [[ -f bitnami/common/templates/_warnings.tpl ]]; then
            awk '
              /^\{\{- define "common.warnings.modifiedImages"/ {
                skip=1; depth=1
                print "{{- define \"common.warnings.modifiedImages\" -}}"
                next
              }
              skip {
                n = gsub(/\{\{-? *(if|range|with|block|define) /, "&")
                depth += n
                n = gsub(/\{\{-? *end *-?\}\}/, "&")
                depth -= n
                if (depth <= 0) {
                  print "{{- end -}}"
                  skip = 0
                }
                next
              }
              { print }
            ' bitnami/common/templates/_warnings.tpl > /tmp/_warnings.tpl && \
              mv /tmp/_warnings.tpl bitnami/common/templates/_warnings.tpl
          fi

          # --- Patch 2: Rewrite chart dependency repositories to fork's GHCR ---
          find bitnami -name Chart.yaml -exec \
            sed -i "s|oci://registry-1.docker.io/bitnamicharts|${OCI_REPO}|g" {} +

          # --- Patch 3: Remove Chart.lock files (digests are invalidated by repo change) ---
          find bitnami -name Chart.lock -delete

          echo "Patches applied: image checks neutered, deps rewritten to ${OCI_REPO}, Chart.lock files removed"

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.1.4

      - name: Compute registry repo
        id: repo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: ${{ github.repository }}
        with:
          result-encoding: string
          script: |
            const [owner] = process.env.REPOSITORY.toLowerCase().split('/');
            return `${process.env.REGISTRY}/${owner}/bitnamicharts`;

      - name: Log in to GHCR for Helm
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build chart dependencies
        working-directory: ${{ steps.parse.outputs.context }}
        run: helm dependency update

      - name: Package chart
        id: pkg
        run: |
          mkdir -p /tmp/chartpkg
          helm package "${{ steps.parse.outputs.context }}" --destination /tmp/chartpkg
          pkg="$(ls -1 /tmp/chartpkg/*.tgz | head -n1)"
          echo "path=$pkg" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Push chart to OCI (GHCR)
        run: |
          helm push "${{ steps.pkg.outputs.path }}" "oci://${{ steps.repo.outputs.result }}" &> push-metadata.txt
          cat push-metadata.txt
          CHART_DIGEST="$(awk '/Pushed: /{print $2}' push-metadata.txt)@$(awk '/Digest: /{print $2}' push-metadata.txt)"
          cosign sign --yes "${CHART_DIGEST}"
          cosign verify "${CHART_DIGEST}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/charts-publish-tag.yml@${{ github.ref }}"
