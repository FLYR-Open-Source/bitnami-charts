name: "[CI/CD] Charts publish"

on:
  workflow_call:
    inputs:
      matrix:
        description: 'Stringified JSON: {"include":[ ... ]}'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Package & publish ${{ matrix.chart }} (${{ matrix.context }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch base branch ref
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin +refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}
      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.1.4

      - name: Compute registry repo
        id: repo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: ${{ github.repository }}
        with:
          result-encoding: string
          script: |
            const [owner] = process.env.REPOSITORY.toLowerCase().split('/');
            return `${process.env.REGISTRY}/${owner}/bitnami-charts`;
      # - name: Install chart-testing (ct)
      #   if: github.event_name == 'pull_request'
      #   uses: helm/chart-testing-action@v2.6.1
      # - name: Create kind cluster
      #   if: github.event_name == 'pull_request'
      #   uses: helm/kind-action@v1.10.0
      # - name: Run chart-testing (lint)
      #   if: github.event_name == 'pull_request'
      #   run: ct lint --target-branch "${{ github.event.pull_request.base.ref }}" --charts "${{ matrix.context }}"
      # - name: Run chart-testing (install)
      #   if: github.event_name == 'pull_request'
      #   run: ct install --target-branch "${{ github.event.pull_request.base.ref }}" --charts "${{ matrix.context }}"

      - name: Build chart dependencies
        working-directory: ${{ matrix.context }}
        run: |
          # Use 'dependency update' instead of 'dependency build' because
          # Chart.lock files are removed during fork patching (digest invalidation).
          # This resolves versions from Chart.yaml and regenerates Chart.lock.
          helm dependency update

      - name: Package chart
        id: pkg
        run: |
          mkdir -p /tmp/chartpkg
          helm package "${{ matrix.context }}" --destination /tmp/chartpkg
          pkg="$(ls -1 /tmp/chartpkg/*.tgz | head -n1)"
          echo "path=$pkg" >> $GITHUB_OUTPUT

      - name: Log in to GHCR for Helm
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Push chart to OCI (GHCR)
        if: github.event_name != 'pull_request'
        run: |
          # Per Helm OCI, reference must be oci://<registry>/<repo> (no name/version)
          # Name and version are taken from the packaged chart.
          helm push "${{ steps.pkg.outputs.path }}" "oci://${{ steps.repo.outputs.result }}" &> push-metadata.txt
          cat push-metadata.txt
          # Extract the full pushed reference from the output metadata
          CHART_DIGEST="$(awk '/Pushed: /{print $2}' push-metadata.txt)@$(awk '/Digest: /{print $2}' push-metadata.txt)"
          cosign sign --yes "${CHART_DIGEST}"
          cosign verify "${CHART_DIGEST}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/charts-publish.yml@${{ github.ref }}"
